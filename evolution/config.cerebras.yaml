# OpenEvolve configuration for kaprekarevolve - backend: cerebras.
#
# Hosted Cerebras inference. Needs CEREBRAS_API_KEY in the environment.
# Select with: uv run kaprekarevolve evolve --backend cerebras
#
max_iterations: 200
# Snapshots the whole population; both visualizers read these, not the live run.
# Defaults to 100, which leaves a short run with nothing to inspect.
checkpoint_interval: 10
random_seed: 42
language: "python"
# The named untried lever: with diffs the model is told "do not rewrite the entire
# program", which kept every run decorating its seed instead of replacing it.
diff_based_evolution: false
max_code_length: 8000

llm:
  provider: "openai"
  api_base: "https://api.cerebras.ai/v1"
  # Resolved from the environment by OpenEvolve; never hardcode the key here.
  #   export CEREBRAS_API_KEY=...
  api_key: "${CEREBRAS_API_KEY}"
  temperature: 0.8
  # Room for reasoning tokens plus a full SEARCH/REPLACE diff.
  max_tokens: 16000
  # Cerebras is fast; the stock 60s is enough, but retries matter more on a
  # shared hosted endpoint than on the homelab box.
  timeout: 180
  retries: 5
  retry_delay: 10
  models:
    # Cerebras' other model, qwen-3.8-27b, is deliberately NOT used here: it spends
    # its entire budget on reasoning tokens and returns empty content (verified up to
    # 64000 max_tokens, where it caps at 40960 reasoning tokens and still emits
    # nothing). Cerebras also rejects `chat_template_kwargs`, so thinking cannot be
    # turned off. OpenEvolve reports this as "LLM returned None response".
    - name: "gpt-oss-120b"
      weight: 1.0

database:
  population_size: 200
  num_islands: 4
  migration_interval: 20
  # Bounded 0..1 and emitted on EVERY path, including rejections. Unbounded counts such
  # as attractor_count broke both ways: one `return value` sets the running max to 10000
  # and squashes every later candidate into bin 0, and a rejected program lacks the key
  # entirely, which made OpenEvolve throw away its rejection artifact before storing it.
  feature_dimensions:
    - "image_ratio"
    - "elegance"
    - "depth_ratio"
  feature_bins: 6

evaluator:
  timeout: 120
  cascade_evaluation: true
  # Must sit BELOW _SCREEN_PASS_SCORE in default_engine.py (0.0001) so a candidate that
  # passes the contract check reaches stage 2, and above 0 so a failed one does not.
  cascade_thresholds: [0.00005]
  enable_artifacts: true      # rejection messages go straight back to the LLM
  parallel_evaluations: 4

prompt:
  num_top_programs: 3
  num_diverse_programs: 2
  include_artifacts: true
  system_message: |
    You are a mathematician hunting for new Kaprekar-like maps on the four-digit
    numbers.

    # THE OBJECT
    `transform(value)` maps an int in 0..9999 to an int in 0..9999. Read the input as
    its zero-padded four-digit form: 49 is "0049", 7 is "0007". Iterating the map from
    any starting number must funnel the whole domain into one small attractor, the way
    Kaprekar's routine funnels 9990 of the 10000 starting numbers into the fixed point
    6174 within seven steps.

    # HARD CONSTRAINTS - a violation scores exactly 0
    - `transform` must be pure and deterministic: no randomness, no global mutable
      state, no IO, no clock, no external input.
    - It must be total on 0..9999 and never raise.
    - It must return an `int` in 0..9999. Never a string, float or bool.
    - No value may need more than 1000 iterations to settle.

    # HOW YOU ARE SCORED
    combined_score = dominance^1.5 x attractor_focus x cycle_quality
                     x depth_score x elegance x novelty

    Six factors, each in 0..1, MULTIPLIED. One weak factor decides the whole score, so
    a map that is excellent on five and poor on one is a poor map.

    - dominance       - share of the 10000 numbers landing in the largest attractor.
                        Maximise it: one basin should swallow nearly everything.
    - attractor_focus - falls off with the number of distinct attractors. Aim for one.
    - cycle_quality   - a fixed point beats a long terminal cycle.
    - depth_score     - a BAND, not a ramp. It PEAKS at mean depth 5 - where Kaprekar's
                        own routine sits - and falls away on BOTH sides. Mean depth 9
                        scores WORSE than mean depth 5, not better. A deepest path over
                        12 steps is penalised again on top.
                        DO NOT lengthen transients to farm depth. That tactic was
                        rewarded by an earlier version of this score and it produced
                        unreadable maps; it now costs you the run.
    - elegance        - falls with the size of transform()'s syntax tree. A branch costs
                        6 nodes, an unexplained integer constant 8, and each element of
                        a list or dict literal 8. One line of arithmetic beats a chain
                        of special cases that reaches the same place.
    - novelty         - near zero if your map's STRUCTURE is already catalogued. The
                        structure is the in-degree profile of the map, normalised, so
                        it sees straight through:
                          * composing a known map with a digit permutation;
                          * adding a constant to a known map;
                          * parity tweaks and rotation chains bolted onto one.
                        All of those are the same map wearing different values. A
                        SHORTER route to a catalogued structure keeps partial credit;
                        a longer one earns almost nothing.

    # KNOWN DEAD ENDS - these all score near 0
    - `return 6174` or any constant; `return value`, the identity.
    - The Kaprekar difference (descending digits minus ascending) and ANYTHING built by
      decorating it: rotations, parity tweaks, digit-sum-driven scrambles, banded
      special cases. Its structure and every relabelling of it are catalogued.
    - Linear combinations `(a*P(v) + b*Q(v) + c) % 10000` where P and Q are digit
      permutations. All 2400 of them have been enumerated; they reach only 7 distinct
      structures and every one is already recorded.

    # WHERE TO LOOK
    Go outside the sorted-digit-difference family, which is exhausted. Structures that
    are NOT in the catalogue:
    - COMPOSING permutations rather than adding them: `desc(v) - rot(asc(v))` is not a
      linear combination and is not catalogued.
    - digit power sums, digital roots, and other maps that discard digit order;
    - modular arithmetic on the value itself, position-weighted digit sums, base
      changes folded back into 0..9999;
    - a map built from a single arithmetic identity rather than a case analysis.
    Keep the code short and the wraparound explicit (`% 10000`), never accidental.
